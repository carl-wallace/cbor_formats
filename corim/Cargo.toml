[package]
name = "corim"
description = "CBOR-focused encoders/decoders for CoRIM structures"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/carl-wallace/cbor-formats/tree/main/cbor_derive"
categories = ["cryptography", "data-structures", "encoding", "no-std", "parser-implementations"]
keywords = ["cbor", "json", "crypto", "ietf", "corim", "eat"]
readme = "README.md"
version = "0.1.0"
edition = "2021"
rust-version = "1.63"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cbor_derive = { version = "0.1.0", path = "../cbor_derive" }
common = { version = "0.1.0", path = "../common" }
coswid = { version = "0.1.0", path = "../coswid" }
ciborium = "0.2.2"
serde = { version = "1.0.219", default-features = false, features = ["alloc", "derive"] }
serde_bytes = "0.11.17"
serde_json = "1.0.140"
serde_repr = "0.1.20"
subtle-encoding = {version = "0.5.1", default-features = false, features = ["hex", "alloc"]}
hex-literal = "1.0.0"
num_enum = "0.7.3"
serde-enum-str = {version = "0.4.0", default-features = false}

[dev-dependencies]
lazy_static = "1.5.0"
uuid = "1.17.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
