[package]
name = "cfcli"
version = "0.1.1"
edition = "2024"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cbor_derive = { version = "0.1.1", path = "../cbor_derive" }
common = { version = "0.1.1", path = "../common" }
corim = { version = "0.1.1", path = "../corim" }
cose = { version = "0.1.1", path = "../cose" }
cose_crypto = { version = "0.1.1", path = "../cose_crypto" }
coswid = { version = "0.1.1", path = "../coswid" }
cots = { version = "0.1.1", path = "../cots" }
eat = { version = "0.1.1", path = "../eat" }
clap = {version = "4.6.0", default-features = false, features=["std", "derive"]}
walkdir = { version = "2"}
ciborium = "0.2.2"
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_bytes = "0.11"
serde_json = "1.0.149"

