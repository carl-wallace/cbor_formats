[package]
name = "jose"
description = "JWS signing and verification built on COSE cryptographic primitives"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/carl-wallace/cbor-formats/tree/main/jose"
categories = ["cryptography", "encoding"]
keywords = ["jose", "jws", "jwt", "cose"]
version = "0.1.1"
edition = "2021"

[features]
default = ["ecdsa"]
# Propagates to cose_crypto/ecdsa. JWS signing/verification with EC P-256/P-384 keys
# requires this feature. Opt out (default-features = false) when only JWE decrypt or
# Ed25519/RSA-based JWS verification is needed.
ecdsa = ["cose_crypto/ecdsa"]

[dependencies]
cose_crypto = { version = "0.1.1", path = "../cose_crypto", default-features = false }
serde = { version = "1.0", features = ["alloc", "derive"] }
serde_json = "1.0"
base64ct = { version = "1.7", features = ["alloc"] }
